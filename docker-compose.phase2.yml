name: ragapp-phase2
services:
  qdrant:
    image: ${PHASE2_QDRANT_IMAGE:-qdrant/qdrant:latest}
    ports:
      - "127.0.0.1:6335:6333"
      - "127.0.0.1:6336:6334"
    volumes:
      - phase2_qdrant_data:/qdrant/storage
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PHASE2_POSTGRES_USER:-ragapp}
      POSTGRES_PASSWORD: ${PHASE2_POSTGRES_PASSWORD:-ragapp}
      POSTGRES_DB: ${PHASE2_POSTGRES_DB:-ragapp}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - phase2_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  phase2_qdrant_data:
  phase2_pg_data:
